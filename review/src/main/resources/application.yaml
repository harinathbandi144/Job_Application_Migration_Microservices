job:
  url: http://localhost:8090
company:
  url: http://localhost:8091
review:
  url: http://localhost:8092

spring:
  application:
    name: review

  datasource:
    url: jdbc:postgresql://localhost:5432/jobdb
    username: root
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8092

eureka:
  client:
      serviceUrl:
        defaultZone: http://localhost:8761/eureka/
      register-with-eureka: true
      fetch-registry: true

