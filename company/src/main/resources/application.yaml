spring:
  application:
    name: company
  datasource:
    url: jdbc:postgresql://localhost:5432/companydb
    username: root
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8091

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true