spring:
  application:
    name: job
  #Config Serviver
  config:
    import: optional:configserver:http://localhost:8080/
#    profiles:
#      active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/jobdb
    username: root
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  port: 8090

#Eureka
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans